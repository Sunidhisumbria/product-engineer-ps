services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
